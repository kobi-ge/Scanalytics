apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: yosefshoval-dev
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics-init
          image: confluentinc/cp-kafka:7.8.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              echo "Waiting for Kafka broker..."
              for i in {1..60}; do
                kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
                sleep 5
              done
              kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic data
              kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic images
              echo "Kafka topics ensured."
