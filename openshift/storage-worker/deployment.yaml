apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-worker
  namespace: yosefshoval-dev
  labels:
    app: storage-worker
    app.kubernetes.io/part-of: scanalytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-worker
  template:
    metadata:
      labels:
        app: storage-worker
    spec:
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-kafka:7.8.3
          command:
            - sh
            - -c
            - |
              until kafka-topics --bootstrap-server broker-svc:9092 --list 2>/dev/null; do
                echo "Waiting for Kafka..."; sleep 5
              done
        - name: wait-for-mongodb
          image: quay.io/mongodb/mongodb-community-server:7.0.5-ubuntu2204
          command:
            - sh
            - -c
            - |
              until mongosh --host mongodb-svc:27017 --eval "db.runCommand('ping').ok" --quiet 2>/dev/null; do
                echo "Waiting for MongoDB..."; sleep 5
              done
        - name: wait-for-elasticsearch
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://elasticsearch:9200/_cluster/health; do
                echo "Waiting for Elasticsearch..."; sleep 5
              done
      containers:
        - name: storage-worker
          image: image-registry.openshift-image-registry.svc:5000/yosefshoval-dev/storage-worker:latest
          envFrom:
            - configMapRef:
                name: scanalytics-config
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 128Mi
