apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: yosefshoval-dev
  labels:
    app: kafka-init
    app.kubernetes.io/part-of: scanalytics
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: kafka-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-kafka:7.8.3
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until kafka-topics --bootstrap-server kafka:9092 --list 2>/dev/null; do
                echo "Kafka not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Kafka is ready!"
      containers:
        - name: create-topics
          image: confluentinc/cp-kafka:7.8.3
          command:
            - bash
            - -c
            - |
              echo "Creating Kafka topics..."
              kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 \
                --partitions 1 --replication-factor 1 --topic data
              kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 \
                --partitions 1 --replication-factor 1 --topic images
              echo "Topics created successfully."
