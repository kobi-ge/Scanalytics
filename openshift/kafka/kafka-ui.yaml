apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: yosefshoval-dev
  labels:
    app: kafka-ui
    app.kubernetes.io/part-of: scanalytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-kafka:7.8.3
          command:
            - sh
            - -c
            - |
              until kafka-topics --bootstrap-server kafka:9092 --list 2>/dev/null; do
                echo "Waiting for Kafka..."; sleep 5
              done
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "scanalytics"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka:9092"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: yosefshoval-dev
  labels:
    app: kafka-ui
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kafka-ui
  namespace: yosefshoval-dev
  labels:
    app: kafka-ui
spec:
  to:
    kind: Service
    name: kafka-ui
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
