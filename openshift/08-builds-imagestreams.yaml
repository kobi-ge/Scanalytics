---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: backend
  namespace: yosefshoval-dev
spec:
  replicas: 1
  selector:
    app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/yosefshoval-dev/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MONGO_URI_SCANALYTICS_DB
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - backend
        from:
          kind: ImageStreamTag
          name: backend:latest
---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: frontend
  namespace: yosefshoval-dev
spec:
  replicas: 1
  selector:
    app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/yosefshoval-dev/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
              protocol: TCP
          env:
            - name: VITE_AUTH_API_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: VITE_AUTH_API_URL
            - name: VITE_INGESTION_API_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: VITE_INGESTION_API_URL
            - name: VITE_INSIGHTS_API_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: VITE_INSIGHTS_API_URL
            - name: INSIGHTS_DASHBOARD_HOST
              value: insights-dashboard
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - frontend
        from:
          kind: ImageStreamTag
          name: frontend:latest
---
