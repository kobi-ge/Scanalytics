---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: backend
  namespace: yosefshoval-dev
spec:
  source:
    type: Git
    git:
      uri: https://github.com/kobi-ge/Scanalytics.git
      ref: k8s
    contextDir: backend
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: backend:latest
  triggers:
    - type: ConfigChange
    - type: GitHub
      github:
        secret: github-webhook-secret
---
