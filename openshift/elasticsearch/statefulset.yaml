apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: yosefshoval-dev
  labels:
    app: elasticsearch
    app.kubernetes.io/part-of: scanalytics
spec:
  clusterIP: None          # Headless for StatefulSet
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: yosefshoval-dev
  labels:
    app: elasticsearch
    app.kubernetes.io/part-of: scanalytics
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      # Elasticsearch needs vm.max_map_count=262144. On OpenShift, use an
      # init container with the proper SCC, or ask a cluster admin to set
      # the sysctl on the node pool.
    spec:
      containers:
        - name: elasticsearch
          image: docker.io/bitnami/elasticsearch:8.17.0
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: BITNAMI_DEBUG
              value: "false"
            - name: ELASTICSEARCH_CLUSTER_NAME
              value: "scanalytics"
            - name: ELASTICSEARCH_IS_DEDICATED_NODE
              value: "no"
            - name: ELASTICSEARCH_NODE_TYPE
              value: "master-data"
            - name: ELASTICSEARCH_HEAP_SIZE
              value: "128m"
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: es-data
              mountPath: /bitnami/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: es-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
