apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: yosefshoval-dev
  labels:
    app: backend
    app.kubernetes.io/part-of: scanalytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: mongo:7.0
          command:
            - sh
            - -c
            - |
              until mongosh --host mongodb:27017 --eval "db.runCommand('ping').ok" --quiet 2>/dev/null; do
                echo "Waiting for MongoDB..."; sleep 5
              done
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/yosefshoval-dev/backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/scanalytics_db"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: yosefshoval-dev
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
  namespace: yosefshoval-dev
  labels:
    app: backend
spec:
  to:
    kind: Service
    name: backend
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
