apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-dashboard
  namespace: yosefshoval-dev
  labels:
    app: insights-dashboard
    app.kubernetes.io/part-of: scanalytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insights-dashboard
  template:
    metadata:
      labels:
        app: insights-dashboard
    spec:
      initContainers:
        - name: wait-for-elasticsearch
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://elasticsearch:9200/_cluster/health; do
                echo "Waiting for Elasticsearch..."; sleep 5
              done
        - name: wait-for-mongodb
          image: quay.io/mongodb/mongodb-community-server:7.0.5-ubuntu2204
          command:
            - sh
            - -c
            - |
              until mongosh --host mongodb-svc:27017 --eval "db.runCommand('ping').ok" --quiet 2>/dev/null; do
                echo "Waiting for MongoDB..."; sleep 5
              done
      containers:
        - name: insights-dashboard
          image: image-registry.openshift-image-registry.svc:5000/yosefshoval-dev/insights-dashboard:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: scanalytics-config
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: insights-dashboard
  namespace: yosefshoval-dev
  labels:
    app: insights-dashboard
spec:
  selector:
    app: insights-dashboard
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: insights-dashboard
  namespace: yosefshoval-dev
  labels:
    app: insights-dashboard
spec:
  to:
    kind: Service
    name: insights-dashboard
  port:
    targetPort: 8001
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
