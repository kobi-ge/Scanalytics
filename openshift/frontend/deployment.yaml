apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: yosefshoval-dev
  labels:
    app: frontend
    app.kubernetes.io/part-of: scanalytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/yosefshoval-dev/frontend:latest
          ports:
            - containerPort: 5173
          env:
            # ── IMPORTANT ───────────────────────────────────────────
            # Vite injects env vars at BUILD TIME for production builds.
            # For the dev server (CMD npm run dev), runtime env vars work.
            # If you switch to a production build (npm run build + nginx),
            # you must bake these values into the build stage or use
            # window.__ENV__ injection at runtime.
            # ────────────────────────────────────────────────────────
            - name: VITE_AUTH_API_URL
              valueFrom:
                configMapKeyRef:
                  name: scanalytics-config
                  key: VITE_AUTH_API_URL
            - name: VITE_INGESTION_API_URL
              valueFrom:
                configMapKeyRef:
                  name: scanalytics-config
                  key: VITE_INGESTION_API_URL
            - name: VITE_INSIGHTS_API_URL
              valueFrom:
                configMapKeyRef:
                  name: scanalytics-config
                  key: VITE_INSIGHTS_API_URL
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 10m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: yosefshoval-dev
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  namespace: yosefshoval-dev
  labels:
    app: frontend
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: 5173
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
