apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yosefshoval-dev

resources:
  # ── Phase 1: Configuration ────────────────────────────────────────
  - 01-secrets.yaml
  - 02-configmap.yaml

  # ── Phase 2: Data Layer (StatefulSets) ────────────────────────────
  - kafka/statefulset.yaml
  - mongodb/statefulset.yaml
  - elasticsearch/statefulset.yaml

  # ── Phase 3: Infrastructure Services ──────────────────────────────
  - kafka/init-job.yaml
  - kafka/kafka-ui.yaml
  - elasticsearch/kibana.yaml

  # ── Phase 4: Application Workers (no inbound traffic) ─────────────
  - extraction-worker/deployment.yaml
  - storage-worker/deployment.yaml

  # ── Phase 5: Application APIs ─────────────────────────────────────
  - api-gateway/deployment.yaml
  - backend/deployment.yaml
  - insights-dashboard/deployment.yaml

  # ── Phase 6: Frontend ─────────────────────────────────────────────
  - frontend/deployment.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: scanalytics
