apiVersion: apps/v1
kind: Deployment
metadata:
  name: extraction-worker
  namespace: yosefshoval-dev
  labels:
    app: extraction-worker
    app.kubernetes.io/part-of: scanalytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extraction-worker
  template:
    metadata:
      labels:
        app: extraction-worker
    spec:
      # ── Init: wait for Kafka, MongoDB, and Elasticsearch ──────────
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-kafka:7.8.3
          command:
            - sh
            - -c
            - |
              until kafka-topics --bootstrap-server kafka:9092 --list 2>/dev/null; do
                echo "Waiting for Kafka..."; sleep 5
              done
        - name: wait-for-mongodb
          image: mongo:7.0
          command:
            - sh
            - -c
            - |
              until mongosh --host mongodb:27017 --eval "db.runCommand('ping').ok" --quiet 2>/dev/null; do
                echo "Waiting for MongoDB..."; sleep 5
              done
        - name: wait-for-elasticsearch
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://elasticsearch:9200/_cluster/health; do
                echo "Waiting for Elasticsearch..."; sleep 5
              done
      containers:
        - name: extraction-worker
          image: image-registry.openshift-image-registry.svc:5000/yosefshoval-dev/extraction-worker:latest
          envFrom:
            - configMapRef:
                name: scanalytics-config
          env:
            - name: LLAMA_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scanalytics-secrets
                  key: LLAMA_CLOUD_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
