version: '3.8'

networks:
  microservices-net:
    driver: bridge

volumes:
  mongodb_data:
  es_data:

services:
  # הטאנל של קלאודפלר - כעת מחובר לרשת הפנימית
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cf-tunnel
    command: tunnel --no-autoupdate run --token eyJhIjoiMmM4MmEyNGM5YzRlNjI1Njg0NGQ1ZGFjMjlhY2YwNjEiLCJ0IjoiYzIwYjk1ZjAtYzJhNy00NDQyLWE3OGUtNmQyYjUzNzcwYWJjIiwicyI6Ik4yWTRaamt6WldFdE56QmlNaTAwTm1VNUxXSTVaVFl0TTJVd01HSTRZamN4T1RjNSJ9
    restart: always
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.8.3
    hostname: kafka
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-net
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...'
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic data
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --topic images
        echo 'Topics created successfully.'
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - microservices-net
    depends_on:
      kafka:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    networks:
      - microservices-net
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - microservices-net
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.0
    container_name: kibana
    ports:
      - "5601:5601" # קיבנה נשאר פתוח מקומית אם אתה צריך, או שאפשר לחסום גם אותו
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - microservices-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  extraction-worker:
    build: ./extraction_worker
    container_name: extraction-worker
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MONGO_URI=mongodb://mongodb:27017
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - microservices-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  api-gateway:
    build: ./api_gateway
    container_name: api-gateway
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # כאן ה-Gateway יכול לנתב פנימית לסרוויסים לפי השם שלהם בדוקר:
      - BACKEND_SERVICE_URL=http://backend:3000
      - INSIGHTS_SERVICE_URL=http://insights_dashboard:5000 
    networks:
      - microservices-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  storage-worker:
    build: ./storageWorker
    container_name: storage-worker
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_DATA_TOPIC=data
      - KAFKA_CONSUMER_GROUP=storage-worker-group
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=metadata_db
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - microservices-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  insights_dashboard:
    build: ./InsightsDashboard
    container_name: InsightsDashboard
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=receipt_items
      - MONGO_URI=mongodb://mongodb:27017
      - GRIDFS_DB_NAME=files_db
      - MONGO_METADATA_DB=metadata_db
    networks:
      - microservices-net
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: backend
    environment:
      - MONGO_URI=mongodb://mongodb:27017/scanalytics_db
    networks:
      - microservices-net
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./Frontend
    container_name: frontend
    environment:
      # הדפדפן של המשתמש יפנה לכתובת הציבורית של ה-API המאובטח בקלאודפלר
      - VITE_AUTH_API_URL=https://api.scforensics.com/api
      - VITE_INGESTION_API_URL=https://api.scforensics.com/api/ingestion
      - VITE_INSIGHTS_API_URL=https://api.scforensics.com/api/insights
    networks:
      - microservices-net
    depends_on:
      - backend
      - api-gateway
      - insights_dashboard